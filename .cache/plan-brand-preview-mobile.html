/* Scope AI controls so the rest of the workspace keeps its own palette. */
.ai-surface, .ai-composer, [data-ai-workspace], .workspace-ai-launcher, .lead-discovery, .lead-search-dialog {
  --primary: var(--ai-foreground);
  --primary-foreground: var(--ai-contrast);
  --ring: var(--ai-accent);
  --brand-soft: var(--ai-soft);
  --action: var(--ai-foreground);
  --action-foreground: var(--ai-contrast);
  --action-hover: color-mix(in srgb, var(--ai-foreground) 85%, var(--foreground));
  --action-ring: var(--ai-accent);
}


.workspace-sidebar a[href=&quot;/lead-channel/ai-leads&quot;] svg,
.ai-surface .settings-policy-group .settings-row-title > svg { color: var(--ai-accent); }
.ai-icon {
  position: relative;
  container-type: inline-size;
  pointer-events: none;
  --flow-speed: 9s;
}

.ai-icon[data-state=&quot;thinking&quot;] {
  --flow-speed: 4.5s;
}

.ai-icon-mist {
  position: relative;
  display: block;
  width: 95%;
  height: 95%;
  overflow: hidden;
  border-radius: 50%;
  background: radial-gradient(circle, var(--ai-glow), transparent 72%);
  mask-image: radial-gradient(circle, #000 35%, rgb(0 0 0 / 85%) 50%, transparent 72%);
  filter: blur(1.25cqw);
}

.ai-icon-mist > span {
  position: absolute;
  display: block;
  width: 80%;
  height: 85%;
  border-radius: 42% 58% 65% 35% / 55% 40% 60% 45%;
  filter: blur(10cqw);
  animation: ai-icon-flow var(--flow-speed) ease-in-out infinite alternate;
}

.ai-icon-pink {
  top: -20%;
  left: 20%;
  background: radial-gradient(ellipse, var(--ai-accent) 8%, var(--ai-highlight) 38%, transparent 70%);
  transform: rotate(-25deg);
}

.ai-icon-mist > .ai-icon-blue {
  top: 10%;
  right: -10%;
  background: radial-gradient(ellipse, var(--ai-foreground) 8%, var(--ai-accent) 45%, transparent 72%);
  animation-delay: -3s;
}

.ai-icon-mist > .ai-icon-cyan {
  bottom: -10%;
  left: -10%;
  background: radial-gradient(ellipse, var(--ai-highlight) 10%, var(--ai-accent) 44%, transparent 72%);
  animation-delay: -6s;
}

@keyframes ai-icon-flow {
  0% { transform: translate(-8%, 5%) rotate(-30deg) scale(0.95, 1.05); }
  50% { transform: translate(15%, -12%) rotate(40deg) scale(1.15, 0.9); }
  100% { transform: translate(-10%, 15%) rotate(110deg) scale(0.9, 1.15); }
}

@media (prefers-reduced-motion: reduce) {
  .ai-icon-mist > span { animation: none; }
}
