.account-setup-progress_progress {
  display: flex;
  align-items: center;
  width: min(100%, 440px);
  margin-inline: auto;
  padding: 0;
  list-style: none;
  font-size: .8125rem;
  line-height: 1.25rem;
}

.account-setup-progress_step { display: flex; flex: 1; align-items: center; gap: 9px; min-width: 0; }
.account-setup-progress_step:last-child { flex: 0 0 auto; }
.account-setup-progress_marker {
  display: grid;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  place-items: center;
  border: 1px solid var(--border, #dedede);
  border-radius: 50%;
  background: var(--card, #fff);
  color: var(--muted-foreground, #737373);
  font-size: .75rem;
  font-weight: 500;
}
.account-setup-progress_label { white-space: nowrap; color: var(--muted-foreground, #737373); }
.account-setup-progress_connector { flex: 1; min-width: 12px; height: 1px; margin-inline: 5px 14px; background: var(--border, #dedede); }
.account-setup-progress_step[data-state=&quot;complete&quot;] .account-setup-progress_marker {
  border-color: transparent;
  background: color-mix(in srgb, var(--primary, #0a2d53) 9%, var(--card, #fff));
  color: var(--primary, #0a2d53);
}
.account-setup-progress_step[data-state=&quot;complete&quot;] .account-setup-progress_connector { background: color-mix(in srgb, var(--primary, #0a2d53) 28%, var(--border, #dedede)); }
.account-setup-progress_step[data-state=&quot;current&quot;] .account-setup-progress_marker {
  border-color: var(--primary, #0a2d53);
  background: var(--primary, #0a2d53);
  color: var(--primary-foreground, #fff);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-orange, #f43425) 12%, transparent);
}
.account-setup-progress_step[data-state=&quot;current&quot;] .account-setup-progress_label { color: var(--primary, #0a2d53); font-weight: 600; }

@media (max-width: 360px) {
  .account-setup-progress_progress { font-size: .75rem; }
  .account-setup-progress_step { gap: 6px; }
  .account-setup-progress_marker { width: 24px; height: 24px; font-size: .6875rem; }
  .account-setup-progress_connector { min-width: 8px; margin-inline: 2px 8px; }
}

.onboarding-shell_page {
  --primary: var(--brand-navy, #0a2d53);
  --primary-foreground: #fff;
  --action: var(--brand-navy, #0a2d53);
  --action-foreground: #fff;
  --action-hover: #164b7b;
  --action-ring: var(--brand-orange, #f43425);
  display: flex;
  min-height: 100svh;
  flex-direction: column;
  background: var(--background);
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
}
.onboarding-shell_header, .onboarding-shell_footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: 100%; padding: 28px clamp(24px, 5vw, 80px); }
.onboarding-shell_header { border-bottom: 1px solid var(--border); }
.onboarding-shell_logo { display: block; width: 174px; flex-shrink: 0; }
.onboarding-shell_logo svg { width: 100%; height: auto; }
.onboarding-shell_body { display: flex; width: min(100%, 1104px); flex: 1; flex-direction: column; justify-content: center; margin-inline: auto; padding: 48px 32px 64px; }
.onboarding-shell_progress { margin-bottom: 56px; }
.onboarding-shell_footer { color: var(--muted-foreground); font-size: .75rem; line-height: 1.5; }
.onboarding-shell_footer > span, .onboarding-shell_footer nav { display: flex; align-items: center; gap: 8px; }
.onboarding-shell_footer nav { gap: 24px; }
.onboarding-shell_footer a:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 4px; }
.onboarding-shell_page a:focus-visible, .onboarding-shell_page button:focus-visible { outline: 2px solid var(--action-ring); outline-offset: 5px; }
.dark .onboarding-shell_page { --primary: #a8cdee; --primary-foreground: #0a2d53; --action: #a8cdee; --action-foreground: #0a2d53; --action-hover: #c3dff7; }
@media (max-width: 639px) {
  .onboarding-shell_header { padding: 22px 24px; }
  .onboarding-shell_logo { width: 148px; }
  .onboarding-shell_body { padding: 36px 24px 48px; }
  .onboarding-shell_progress { margin-bottom: 40px; }
  .onboarding-shell_footer { flex-wrap: wrap; justify-content: center; padding: 20px 24px; text-align: center; }
}

.onboarding-completion_intro { text-align: center; }
.onboarding-completion_successIcon, .onboarding-completion_paymentIcon { display: grid; width: 64px; height: 64px; place-items: center; margin: 0 auto 24px; border: 1px solid #cdece0; border-radius: 20px; background: #edf9f3; color: #138158; box-shadow: 0 0 0 8px color-mix(in srgb, #138158 3%, transparent); }
.onboarding-completion_paymentIcon { border-color: var(--border); background: var(--muted); color: var(--primary); box-shadow: none; }
.onboarding-completion_eyebrow { margin-bottom: 12px; color: var(--muted-foreground); font-size: .75rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.onboarding-completion_title { margin: 0; font-size: clamp(2rem, 3.5vw, 2.75rem); font-weight: 600; line-height: 1.15; letter-spacing: -.04em; }
.onboarding-completion_description { max-width: 520px; margin: 16px auto 0; color: var(--muted-foreground); font-size: .9375rem; line-height: 1.7; overflow-wrap: anywhere; }
.onboarding-completion_workspaceName { color: var(--foreground); font-weight: 500; }
.onboarding-completion_sectionLabel { margin-bottom: 14px; color: var(--muted-foreground); font-size: .75rem; font-weight: 500; letter-spacing: .04em; }
.onboarding-completion_steps { margin-top: 48px; }
.onboarding-completion_cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.onboarding-completion_card { display: flex; min-width: 0; flex-direction: column; align-items: flex-start; padding: 24px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); transition: border-color 150ms, background 150ms; }
.onboarding-completion_card:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); background: color-mix(in srgb, var(--primary) 2%, var(--card)); }
.onboarding-completion_cardIcon { display: grid; width: 42px; height: 42px; place-items: center; margin-bottom: 24px; border-radius: 11px; background: var(--muted); color: var(--primary); }
.onboarding-completion_card h2 { font-size: .9375rem; font-weight: 600; line-height: 1.5; }
.onboarding-completion_card p { flex: 1; margin: 8px 0 24px; color: var(--muted-foreground); font-size: .8125rem; line-height: 1.65; }
.onboarding-completion_cardAction { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; color: var(--primary); font-size: .8125rem; font-weight: 500; }
.onboarding-completion_actions { display: flex; flex-direction: column; align-items: center; margin-top: 36px; }
.onboarding-completion_primaryButton { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 12px; padding: 12px 30px; border-radius: 9px; background: var(--action); color: var(--action-foreground); font-size: .875rem; font-weight: 500; transition: background 150ms; }
.onboarding-completion_primaryButton:hover { background: var(--action-hover); }
.onboarding-completion_note { margin-top: 16px; color: var(--muted-foreground); font-size: .75rem; line-height: 1.7; text-align: center; }
.onboarding-completion_checkout { width: min(100%, 520px); margin-inline: auto; }
.onboarding-completion_back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 32px; color: var(--muted-foreground); font-size: .8125rem; }
.onboarding-completion_back:hover { color: var(--foreground); }
.onboarding-completion_summary { margin-top: 32px; overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
.onboarding-completion_summaryHeading { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--border); }
.onboarding-completion_summaryHeading h2 { font-size: .875rem; font-weight: 600; }
.onboarding-completion_badge { padding: 4px 9px; border-radius: 6px; background: #edf9f3; color: #138158; font-size: .6875rem; font-weight: 500; }
.onboarding-completion_details { display: grid; gap: 14px; padding: 24px; font-size: .8125rem; }
.onboarding-completion_details > div { display: flex; justify-content: space-between; gap: 24px; }
.onboarding-completion_details dt { color: var(--muted-foreground); }
.onboarding-completion_details dd { text-align: right; font-weight: 500; overflow-wrap: anywhere; }
.onboarding-completion_discount { color: #138158; }
.onboarding-completion_total { padding-top: 18px; border-top: 1px solid var(--border); }
.onboarding-completion_total dt { color: var(--foreground); font-weight: 500; }
.onboarding-completion_total dd { font-size: 1.125rem; line-height: 1.25; }
.onboarding-completion_cashier { margin-top: 28px; }
.onboarding-completion_cashier p { margin-bottom: 16px; color: var(--muted-foreground); font-size: .875rem; line-height: 1.6; text-align: center; }
.onboarding-completion_qr { display: block; width: 100%; max-width: 300px; height: 350px; margin-inline: auto; border: 1px solid var(--border); border-radius: 12px; background: white; }
.onboarding-completion_externalPayment { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; color: var(--primary); font-size: .8125rem; text-decoration: underline; text-underline-offset: 4px; }
.onboarding-completion_status { display: grid; justify-items: center; gap: 16px; margin-top: 28px; text-align: center; }
.onboarding-completion_statusMessage { display: flex; align-items: center; justify-content: center; gap: 9px; color: var(--muted-foreground); font-size: .8125rem; line-height: 1.6; }
.onboarding-completion_spinner { flex-shrink: 0; animation: spin 1.2s linear infinite; }
.onboarding-completion_retry { min-height: 42px; padding: 10px 20px; border: 1px solid var(--border); border-radius: 8px; font-size: .8125rem; cursor: pointer; }
.onboarding-completion_retry:hover { background: var(--muted); }
.onboarding-completion_error { color: var(--destructive); font-size: .8125rem; line-height: 1.6; }
.onboarding-completion_returnLink { color: var(--primary); font-size: .8125rem; text-decoration: underline; text-underline-offset: 4px; }
.onboarding-completion_assurance { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .onboarding-completion_spinner { animation: none; } .onboarding-completion_card, .onboarding-completion_primaryButton { transition: none; } }
.dark .onboarding-completion_successIcon, .dark .onboarding-completion_badge { border-color: #245640; background: #112b20; color: #7bddb2; }
.dark .onboarding-completion_discount { color: #7bddb2; }
@media (max-width: 639px) {
  .onboarding-completion_steps { margin-top: 32px; }
  .onboarding-completion_card { padding: 20px; }
  .onboarding-completion_cardIcon { margin-bottom: 16px; }
  .onboarding-completion_card p { margin-bottom: 18px; }
  .onboarding-completion_actions { margin-top: 28px; }
  .onboarding-completion_primaryButton { width: 100%; }
  .onboarding-completion_summaryHeading, .onboarding-completion_details { padding: 20px; }
}
