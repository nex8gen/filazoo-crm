.wizard_wizard { width: min(100%, 640px); margin-inline: auto; }
.wizard_hero { padding-bottom: 28px; text-align: center; }
.wizard_eyebrow { color: var(--muted-foreground); font-size: .8125rem; overflow-wrap: anywhere; }
.wizard_title { margin: 8px 0 12px; font-size: clamp(1.75rem, 2.7vw, 2.25rem); line-height: 1.3; font-weight: 600; letter-spacing: -.035em; outline: none; }
.wizard_description { color: var(--muted-foreground); font-size: .875rem; line-height: 1.6; }
.wizard_progress { display: flex; justify-content: center; gap: 32px; margin-top: 28px; padding: 0; list-style: none; }
.wizard_progress li { display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: .8125rem; }
.wizard_progress li > span { display: grid; width: 25px; height: 25px; place-items: center; border: 1px solid var(--border); border-radius: 50%; font-size: .6875rem; }
.wizard_progress li[data-active=&quot;true&quot;] { color: var(--primary); font-weight: 500; }
.wizard_progress li[data-active=&quot;true&quot;] > span { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-orange) 10%, transparent); }
.wizard_progress li[data-complete=&quot;true&quot;] > span { background: color-mix(in srgb, var(--primary) 7%, var(--background)); color: var(--primary); }
.wizard_form { padding: 28px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
.wizard_form fieldset { display: grid; gap: 20px; min-width: 0; border: 0; padding: 0; }

.wizard_field input, .wizard_field select { width: 100%; min-width: 0; height: 42px; padding: 9px 12px; border: 1px solid var(--input); border-radius: 8px; outline: none; background: var(--background); color: var(--foreground); font: inherit; font-weight: 400; }
.wizard_field input:focus, .wizard_field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 12%, transparent); }
.wizard_field input::placeholder { color: var(--muted-foreground); }
.wizard_field input:disabled, .wizard_field select:disabled { opacity: .65; }
.wizard_grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.wizard_hint, .wizard_optional { color: var(--muted-foreground); font-size: .75rem; font-weight: 400; line-height: 1.7; }
.wizard_serverFields { display: grid; gap: 16px; }
.wizard_serverFields summary { cursor: pointer; color: var(--primary); font-size: .8125rem; }
.wizard_serverFields details > div { margin-top: 16px; }
.wizard_navigation { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; }
.wizard_navigation > div { display: flex; align-items: center; gap: 12px; }
.wizard_primary, .wizard_secondary, .wizard_textButton { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 10px 16px; font-size: .8125rem; font-weight: 500; cursor: pointer; }
.wizard_primary { background: var(--action); color: var(--action-foreground); }
.wizard_primary:hover { background: var(--action-hover); }
.wizard_secondary { border: 1px solid var(--border); background: var(--background); color: var(--foreground); }
.wizard_secondary:hover { background: var(--muted); }
.wizard_textButton { color: var(--muted-foreground); padding-inline: 8px; }
.wizard_textButton:hover { color: var(--foreground); }
.wizard_wizard button:disabled { cursor: default; opacity: .45; }
.wizard_optional { margin-top: 20px; text-align: center; }
.wizard_error { margin-top: 20px; color: var(--destructive); font-size: .8125rem; line-height: 1.6; }
.wizard_success { display: flex; gap: 8px; align-items: flex-start; margin-top: 20px; color: #138158; font-size: .8125rem; line-height: 1.6; }
.wizard_success svg { flex-shrink: 0; margin-top: 2px; }
.wizard_invitation { display: grid; justify-items: start; gap: 12px; margin-top: 16px; }
.wizard_invitation .wizard_field { width: 100%; }
.wizard_finish { display: flex; flex-direction: column; align-items: center; padding: 32px; border: 1px solid var(--border); border-radius: 14px; }
.wizard_finishIcon { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 18px; color: #138158; background: color-mix(in srgb, #138158 8%, var(--background)); }

.wizard_finish li > span:last-child { color: var(--muted-foreground); }
.wizard_finish > .wizard_primary { width: 100%; }
.wizard_finish > .wizard_textButton { margin-top: 12px; }
.dark .wizard_success { color: #7bddb2; }
@media (max-width: 639px) {
  .wizard_progress { gap: 20px; }
  .wizard_form { padding: 20px; }
  .wizard_field input, .wizard_field select { font-size: 1rem; }
  .wizard_navigation { flex-wrap: wrap; }
  .wizard_navigation > div { flex: 1; justify-content: flex-end; flex-wrap: wrap; }
  .wizard_grid { grid-template-columns: 1fr; }
}
